<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="O3D-ALIGN: breathwork, movement, meditation and sound in a retro spaceship console."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="O3D-ALIGN"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>@font-face{font-family:'Orbitron';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/orbitron-500.woff2) format('woff2')}@font-face{font-family:'Orbitron';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/orbitron-700.woff2) format('woff2')}@font-face{font-family:'Share Tech Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/share-tech-mono-400.woff2) format('woff2')}</style></head><body>
<title>O3D-ALIGN</title>
<style>
/* Layout: one retro bridge console, 5-column instrument grid, single phosphor accent on black */
:root{--a:#00ff41;--b40:#00ff4166;--b2a:#00ff412a;--bb3:#00ff41b3;--bg4:#00ff410a;--g:#00ff4180;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000}
body{background:#000;color:var(--bb3);font:13px/1.3 'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border-radius:0;-webkit-appearance:none;appearance:none}
input,select{font:inherit;color:var(--a);background:#000;border:1px solid var(--b40);border-radius:0;padding:8px 10px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:1px solid var(--a);outline-offset:2px}
.app{position:relative;display:flex;flex-direction:column;height:100%;background:#000}
.tb{flex:none;height:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) minmax(0,1fr);align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--b40)}
.l,.r{display:flex;align-items:center;gap:8px;min-width:0}.l{justify-self:start}.r{justify-self:end}
.dot{width:12px;height:12px;border:1px solid var(--a);background:var(--b2a);border-radius:50%;display:inline-block}
.native-mac .dot{display:none}.native-mac .tb{padding-left:84px}.native-mac #ttl{transform:translateX(-34px)}
@media (display-mode:standalone){.dot{display:none}}
.ttl{flex:1;min-width:0;text-align:center;font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;letter-spacing:.34em;color:var(--a);text-shadow:0 0 8px var(--g);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;letter-spacing:.12em;color:var(--bb3);text-transform:uppercase;white-space:nowrap}
.daybar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--b40);background:var(--b2a)}
.daybar[hidden]{display:none}.daybar .wrap{gap:8px}
.main.focus .grid{display:flex;flex-direction:column;height:100%;min-height:0}
.main.focus .pn:not(.keep),.main.focus .col{display:none}
.main.focus .pn.keep{flex:1;min-height:0;grid-column:auto}
.main{flex:1;min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;height:100%;min-height:640px}
.rows2{grid-template-rows:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.pn{border:1px solid var(--b40);background:var(--bg4);display:flex;flex-direction:column;min-height:0;min-width:0;text-align:left}
.hd{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border-bottom:1px solid var(--b40);font-family:'Orbitron',sans-serif;font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--a);white-space:nowrap;overflow:hidden}
.pb{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.pb.flush{padding:0;gap:0}
.pb.row{flex-direction:row;align-items:center;gap:22px}
.tile{cursor:pointer;padding:0;color:var(--bb3);display:flex}
.tile:hover{background:var(--b2a)}
.tl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;flex:none;font-size:13px;letter-spacing:.12em;text-transform:uppercase;min-width:0}
.eng{margin-top:8px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.2em}
.ico{width:150px;height:150px;flex:none;display:block}
.btn{border:1px solid var(--a);background:transparent;color:var(--a);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:0 12px;height:36px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{background:var(--b2a)}
.btn.on{background:var(--a);color:#000}
.btn.on:hover{background:var(--a)}
.btn.sm svg{display:block}.btn.sm{height:28px;padding:0 8px;font-size:11px}
.btn.lg{height:46px;font-size:13px}
.btn.tall{height:auto;padding:8px 10px;flex-direction:column;align-items:stretch;text-align:left;gap:4px}
.btn[hidden]{display:none}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bb3)}
.ot{font-family:'Orbitron',sans-serif;font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--a)}
.big{font-size:64px;line-height:1;color:var(--a);text-shadow:0 0 12px var(--g)}
.glow{color:var(--a);text-shadow:0 0 10px var(--g)}
.split{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.segs{display:flex;gap:2px;width:100%}
.seg{flex:1;height:14px;background:var(--b2a);border:0;padding:0;min-width:0;display:block}

.seg.on{background:var(--a)}
.rt{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-bottom:1px solid var(--b2a);font-size:12px;letter-spacing:.08em;text-transform:uppercase;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
button.rt{cursor:pointer;color:var(--bb3)}
button.rt:hover{background:var(--b2a)}
.btn:disabled{opacity:.3;pointer-events:none}
.rt.on{background:var(--a);color:#000}
.prow{display:flex;gap:6px}.prow .btn:first-child{flex:1;min-width:0}
.phase{font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(15px,2.2vw,26px);letter-spacing:.3em;text-align:center;color:var(--a);text-shadow:0 0 12px var(--g);min-height:34px;padding-left:.3em}
.vis{position:relative;flex:1;min-height:260px;width:100%}
.vis canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.cnt{font-size:48px;line-height:1;color:var(--a);text-shadow:0 0 12px var(--g)}
.step{display:flex;align-items:center;gap:10px}
.step .v{min-width:80px;text-align:center;font-size:20px;color:var(--a);text-shadow:0 0 8px var(--g)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--b2a)}
.lay{flex:none;flex-direction:row;min-height:104px}
.lay>div{padding:12px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.lc1{width:190px;flex:none;border-right:1px solid var(--b40)}
.lc2{flex:1}
.lc3{width:310px;flex:none;border-left:1px solid var(--b40)}
.lc4{width:130px;flex:none;border-left:1px solid var(--b40)}
.src{font-size:18px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane{position:relative;height:30px;background:var(--b2a)}
.lane i{position:absolute;top:0;bottom:0;background:var(--b40);display:block}
.lane b{position:absolute;left:8px;top:4px;font-weight:400;font-size:11px;letter-spacing:.12em;background:#000;color:var(--a);padding:2px 6px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--a);left:0}
.sw{width:44px;height:44px;border:1px solid var(--b40);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--a);outline-offset:3px}
.ovl{position:absolute;left:0;right:0;top:0;bottom:0;background:#000;z-index:40;display:flex;flex-direction:column}
.ovl[hidden]{display:none}
.ovb{flex:1;min-height:0;display:flex}
.tabs{width:200px;flex:none;border-right:1px solid var(--b40);padding:16px;display:flex;flex-direction:column;gap:8px}
.set{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.scan{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px)}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
.scr{overflow:auto}
.cc{align-items:center;justify-content:center;text-align:center;gap:10px}.icobox{display:block;position:relative;flex:1;min-height:110px;width:100%}.icobox canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.figrow{display:flex;align-items:stretch;gap:14px;flex:1;min-height:320px}.figbox{position:relative;flex:1;min-width:0}.figbox canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}.ovl.dim{background:rgba(0,0,0,.82);align-items:center;justify-content:center}.dlgbox{border:1px solid var(--a);background:#000;padding:24px;display:flex;flex-direction:column;gap:14px;max-width:440px;width:calc(100% - 32px)}
@media(max-width:900px){
 .main{overflow:auto}
 .grid{display:flex;flex-direction:column;height:auto;min-height:0}
 .grid>*{grid-column:auto!important;flex:none}
 .col{flex:none}
 .tile{min-height:340px}
 .ico{width:110px;height:110px}
 .big{font-size:48px}
 .lay{flex-direction:column}
 .lay>div{width:auto!important;border:0!important}
 .tabs{width:110px;padding:10px}
 .set{padding:14px}
 .pb{overflow:visible}
 .vis{min-height:300px;flex:none;height:300px}
 .dot{display:none}.dm{display:none}.grid>.pn[style*='grid-row']{order:9}.figrow{min-height:260px}
 .ttl{letter-spacing:.2em;font-size:11px}
}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
html[data-look=normal] .scan{display:none}
html[data-look=normal] body{font:13px/1.35 -apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[data-look=normal] .ttl,html[data-look=normal] .hd,html[data-look=normal] .ot,html[data-look=normal] .phase,html[data-look=normal] .eng{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif}
html[data-look=normal] .ttl{color:#fff;text-shadow:none;font-weight:600;font-size:13px;letter-spacing:.14em}
html[data-look=normal] .hd{height:38px;font-weight:600;font-size:11px;letter-spacing:.08em;color:rgba(235,235,245,.62);border-bottom:1px solid rgba(255,255,255,.06)}
html[data-look=normal] .ot{color:#fff;font-weight:600;letter-spacing:.06em}
html[data-look=normal] .pn{border:0;border-radius:20px;background:#1c1c1e;overflow:hidden}
html[data-look=normal] .tb,html[data-look=normal] .daybar{border-bottom:1px solid rgba(255,255,255,.08)}
html[data-look=normal] .tile:hover{background:#242427}
html[data-look=normal] .btn{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:999px;font-weight:600;letter-spacing:.05em}
html[data-look=normal] .btn:hover{background:rgba(255,255,255,.17)}
html[data-look=normal] .btn.on,html[data-look=normal] .btn.on:hover{background:var(--a);color:var(--on)}
html[data-look=normal] .btn.tall{border-radius:16px}
html[data-look=normal] .rt.on{background:var(--a);color:var(--on)}
html[data-look=normal] .glow,html[data-look=normal] .big,html[data-look=normal] .cnt,html[data-look=normal] .step .v,html[data-look=normal] .phase{color:#fff;text-shadow:none}
html[data-look=normal] .phase{font-weight:600;letter-spacing:.2em}
html[data-look=normal] .segs{gap:3px}
html[data-look=normal] .seg{border-radius:4px;background:rgba(255,255,255,.1)}
html[data-look=normal] .seg.on{background:var(--a)}
html[data-look=normal] input,html[data-look=normal] select{background:#2c2c2e;border:0;border-radius:12px;color:#fff}
html[data-look=normal] .sw{border-radius:50%;border:0}
html[data-look=normal] .lane{border-radius:8px;overflow:hidden;background:rgba(255,255,255,.06)}
html[data-look=normal] .lane i{background:rgba(255,255,255,.16)}
html[data-look=normal] .lane b{background:rgba(0,0,0,.55);border-radius:6px;color:#fff;letter-spacing:.05em}
html[data-look=normal] .cursor{background:#fff}
html[data-look=normal] .dlgbox{border:0;border-radius:26px;background:#1c1c1e}
html[data-look=normal] .ovl.dim{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}
html[data-look=normal] .dot{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.12)}

</style>

<div class="app" id="app">
 <header class="tb">
  <div class="l"><span class="dot"></span><span class="dot"></span><span class="dot"></span><button class="btn sm" id="homeBtn" data-act="home" hidden>&lt; HOME</button></div>
  <div class="ttl" id="ttl">O3D-ALIGN // HOME</div>
  <div class="r"><span class="tag" id="sync">● --</span><button class="btn sm" id="muteBtn" data-act="openMix" aria-label="Audio mixer">AUDIO</button><button class="btn sm" id="rtBtn" data-act="togRoutines" aria-label="Show or hide saved routines" hidden>ROUTINES</button><button class="btn sm" id="fsBtn" data-act="fs" aria-label="Toggle full screen" title="Full screen" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button><button class="btn sm" data-act="openSet" aria-label="Settings" title="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>

<script>
try{if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.speech&&!navigator.maxTouchPoints)document.documentElement.classList.add('native-mac')}catch(e){}
(()=>{
'use strict';
/* ================= util ================= */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const mmss=s=>{s=Math.max(0,Math.round(s));return pad(Math.floor(s/60))+':'+pad(s%60)};
const hhmm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACTS={};

/* ================= state ================= */
const KEY='bridge.v1';
const defaults=()=>({
 accent:'#00ff41',voice:true,cues:true,rate:.9,voiceName:'',vis:'lungs',opt:{},
 customs:[],
 routines:[
  {id:'r1',name:'MORNING FORGE',blocks:[{p:'bha',mins:2},{rest:90},{p:'wimt',mins:20},{p:'bha',mins:2},{rest:60},{p:'wimt',mins:5}]},
  {id:'r2',name:'NIGHT DESCENT',blocks:[{p:'coh',reps:20},{rest:20},{p:'f478',reps:8}]},
  {id:'r3',name:'BOX 4X4',blocks:[{p:'box',reps:12}]}
 ],
 sleep:{freq:'528',amb:'RAIN',vo:'AFFIRMATIONS',v20:true,len:480,sched:{on:false,from:1290,to:495},layers:[{vol:12,start:0,stop:480},{vol:15,start:0,stop:480},{vol:8,start:420,stop:480}]},
 mdBack:'NONE',mdPair:true,move:{mins:30,level:'std',custom:null},mvRoutines:[{id:'m1',name:'QUICK BURN',rest:15,items:[{ex:'BURPEES',secs:30,sets:3},{ex:'MOUNTAIN CLIMBERS',secs:30,sets:3},{ex:'PUSH UPS',secs:30,sets:3}]}]
});
let S;
try{S=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=defaults()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(S.vis==='sphere')S.vis='lungs';if(!S.dayRoutines)S.dayRoutines=[{id:'d1',name:'COMBO',steps:[{type:'breath',ref:'r:r1'},{type:'move',ref:'c:m1'},{type:'med',ref:'2'}]}];S.dayRoutines.forEach(r=>{if(r.name==='FULL DAY'||r.name==='DAILY FLOW')r.name='COMBO'});if(S.showRoutines===undefined)S.showRoutines=false;{const X=['QUAD STRETCH','CHEST OPENER','SPINAL TWIST'];if(S.mvRoutines)S.mvRoutines=S.mvRoutines.map(r=>Object.assign({},r,{items:r.items.filter(it=>X.indexOf(it.ex)<0)})).filter(r=>r.items.length)}if(S.sleep&&S.sleep.amb==='DRIZZLE')S.sleep.amb='DROPLETS';if(S.sleep){if(!S.sleep.v20){S.sleep.layers.forEach(c=>{c.vol=Math.round(c.vol/24*20)});S.sleep.v20=true}if(S.sleep.len==null)S.sleep.len=480;if(!S.sleep.sched)S.sleep.sched={on:false,from:1290,to:495}}

const ACC=[['MATRIX','#00ff41'],['MINT','#98ffcc'],['LIME','#b6ff00'],['EMERALD','#00d98b'],['SEAFOAM','#5fffd7'],['AMBER','#ffb000']];
const ACCN=[['BLUE','#0a84ff'],['SKY','#64d2ff'],['MINT','#30d158'],['ORANGE','#ff9f0a'],['RED','#ff453a'],['PINK','#ff375f'],['WHITE','#f5f5f7']];
const accList=()=>S.look==='normal'?ACCN:ACC;
function theme(){const a=S.accent,N=S.look==='normal',d=document.documentElement,r=d.style;d.setAttribute('data-look',N?'normal':'matrix');r.setProperty('--a',a);
 const rgb=hexrgb(a),lum=(rgb[0]*.299+rgb[1]*.587+rgb[2]*.114)/255;r.setProperty('--on',lum>.62?'#000':'#fff');
 if(N){r.setProperty('--b40','rgba(255,255,255,.12)');r.setProperty('--b2a','rgba(255,255,255,.08)');r.setProperty('--bb3','rgba(235,235,245,.62)');r.setProperty('--bg4','#1c1c1e');r.setProperty('--g','transparent')}
 else{r.setProperty('--b40',a+'66');r.setProperty('--b2a',a+'2a');r.setProperty('--bb3',a+'b3');r.setProperty('--bg4',a+'0a');r.setProperty('--g',a+'80')}}

 };

const BAG={};
function bagPick(key,list){let b=BAG[key];if(!b||!b.length){b=list.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=b[i];b[i]=b[j];b[j]=x}if(BAG.last&&b.length>1&&b[b.length-1]===BAG.last)b.unshift(b.pop());BAG[key]=b}const v=b.pop();BAG.last=v;return v}
function voiceRamp(L){if(!SL.running)return 1;const c=S.sleep.layers[L.i],el=(Date.now()-SL.t0)/1000-c.start*60,r=clamp(el/120,0,1);return Math.pow(r,1.3)}
function voiceLoop(L){L.vtok=(L.vtok||0)+1;const tok=L.vtok,gap=()=>14000+Math.random()*12000;
 const go=()=>{if(!L.active||L.vtok!==tok)return;if(MD.state==='playing'){L.vt=setTimeout(go,5000);return}
  let done=false;const next=()=>{if(done)return;done=true;clearTimeout(L.vs);if(L.active&&L.vtok===tok)L.vt=setTimeout(go,gap())};
  const gr=S.sleep.vo==='GRATITUDE',ok=say(bagPick(gr?'g':'a',gr?GRAT:SLAFF),{force:true,rate:.74,pitch:.86,vol:Math.max(.005,volOf(L.i)*voiceRamp(L)),cancel:false,mod:'relax',fx:S.voiceFx?'reverb':null,onend:next});
  L.vs=setTimeout(next,20000);if(!ok)next()};
 go()}
function layerOn(L){if(L.active)return;if(!ac())return;ensureGraph(L);L.active=true;if(L.file){const fl=L.file;if(!fl.el){L.active=false;return}fl.el.play().catch(e=>{if(e.name==='NotSupportedError'&&fl.bad)fl.bad();else fl.state='BLOCKED: '+e.name})}else if(L.kind==='freq')L.src=mkTone(+S.sleep.freq,L.gain);else if(L.kind==='amb')L.src=mkAmbient(S.sleep.amb,L.gain);else voiceLoop(L);applyVol(L)}
function layerOff(L){if(!L.active)return;L.active=false;clearTimeout(L.vt);clearTimeout(L.vs);L.vtok=(L.vtok||0)+1;if(L.file)L.file.el.pause();if(L.src){L.src.stop();L.src=null}if(L.kind==='voice'){try{speechSynthesis.cancel()}catch(e){}}}

const slEnd=()=>S.sleep.len*60;

function sleepTick(){if(!SL.running)return;const el=(Date.now()-SL.t0)/1000;if(el>=slEnd()){sleepStop();if(CUR==='sleep')render();return}SL.layers.forEach((_,i)=>syncLayer(i));const t=slTimes();st('slEl',t[0]);st('slLeft',t[1]);const cu=document.getElementById('slCur');if(cu)cu.style.left=Math.min(100,el/60/S.sleep.len*100)+'%'}
function sleepStart(t0){ac();SL.layers.forEach(L=>{L.preview=false;L.userOn=true;layerOff(L)});SL.running=true;SL.t0=t0||Date.now();clearInterval(SL.timer);SL.timer=setInterval(sleepTick,1000);sleepTick();wake(true)}

const c12=m=>{const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+':'+pad(mm)+(h<12?' AM':' PM')};
function schedLen(){const a=S.sleep.sched,d=((a.to-a.from)%1440+1440)%1440;return d||1440}
function slApplyLen(n){const o=S.sleep.len;n=clamp(n,15,1440);S.sleep.len=n;S.sleep.layers.forEach((c,i)=>{if(i===2&&c.start===o-60)c.start=Math.max(0,n-60);if(c.stop===o||c.stop>n)c.stop=n;if(c.start>n-15)c.start=Math.max(0,n-15);if(c.start>c.stop-15)c.start=Math.max(0,c.stop-15)})}
function slNextStart(){const s=S.sleep.sched,n=new Date(),now=Date.now(),len=S.sleep.len*60000,at=d=>new Date(n.getFullYear(),n.getMonth(),n.getDate()+d,0,s.from).getTime();
 for(const d of[-1,0]){const f=at(d);if(now>=f&&now<f+len)return{now:true,t:f}}
 return{now:false,t:now<at(0)?at(0):at(1)}}

const FATT=[['audio',null],['audio','audio/mp4'],['video',null]];
function loadFile(i,f){
 const c=ac();if(!c||!f)return;
 const L=SL.layers[i];layerOff(L);
 if(L.file){try{L.file.el.pause();URL.revokeObjectURL(L.file.url)}catch(e){}}
 const fl={name:f.name,f,att:-1,state:'LOADING',el:null,url:null};
 L.file=fl;
 if(SL.running)L.userOn=true;else L.preview=true;
 fileAttempt(i,fl);render();
}
function fileAttempt(i,fl){
 const L=SL.layers[i];fl.att++;
 if(fl.el){try{fl.el.pause();fl.el.removeAttribute('src');fl.el.load()}catch(e){}if(fl.url)URL.revokeObjectURL(fl.url)}
 if(fl.att>=FATT.length){L.active=false;fl.el=null;fl.state='CANNOT PLAY: CODEC NOT SUPPORTED. EXPORT AUDIO ONLY (M4A OR MP3)';return}
 const kind=FATT[fl.att][0],mime=FATT[fl.att][1];
 const el=kind==='video'?document.createElement('video'):new Audio();
 if(kind==='video')el.playsInline=true;
 el.preload='auto';el.loop=true;
 const url=URL.createObjectURL(mime?new Blob([fl.f],{type:mime}):fl.f);
 el.src=url;ensureGraph(L);
 try{ac().createMediaElementSource(el).connect(L.gain)}catch(e){}
 fl.el=el;fl.url=url;fl.state='LOADING';
 const bad=()=>{if(L.file===fl&&fl.el===el){L.active=false;fileAttempt(i,fl)}};
 fl.bad=bad;
 el.addEventListener('error',bad);
 el.addEventListener('canplay',()=>{if(L.file===fl&&fl.el===el&&fl.state==='LOADING')fl.state='READY'});
 el.addEventListener('playing',()=>{if(L.file===fl&&fl.el===el)fl.state='PLAYING'});
 el.addEventListener('pause',()=>{if(L.file===fl&&fl.el===el&&fl.state==='PLAYING')fl.state='PAUSED'});
 L.active=false;syncLayer(i);
}

const WARM=[['JUMPING JACKS','Arms overhead, feet wide, steady pace'],['ARM CIRCLES','Big slow circles, then reverse'],['HIP CIRCLES','Hands on hips, wide circles each way'],['HIGH KNEES','Drive knees to hip height'],['BODYWEIGHT SQUATS','Slow and controlled'],['TORSO TWISTS','Rotate from the waist']];
const MAIN=[['PUSH UPS','Chest to floor, body straight. Knees down if needed'],['SQUATS','Hips back, chest up, thighs parallel'],['SIT UPS','Hands across chest, curl all the way up'],['LUNGES','Alternate legs, back knee near the floor'],['PLANK','Forearms down, hold the body straight'],['MOUNTAIN CLIMBERS','Hands under shoulders, drive knees fast'],['GLUTE BRIDGES','Lie back, drive hips up, squeeze'],['BURPEES','Drop, push up, jump. Step it if needed'],['FLUTTER KICKS','On your back, small fast scissor kicks'],['JUMP SQUATS','Explode up, land soft']];
const COOL=[['HAMSTRING FOLD','Soft knees, reach toward the floor'],['CHILD POSE','Hips to heels, arms long'],['DEEP BREATHING','Slow breath in, long breath out']];
const LV={easy:[30,30,'EASY 30/30'],std:[40,20,'STANDARD 40/20'],hard:[45,15,'HARD 45/15']};
function movePlan(mins,lvl){const w=LV[lvl][0],r=LV[lvl][1],out=[];const shrt=mins<=10,ws=shrt?20:30,WM=shrt?[WARM[0],WARM[3],WARM[4]]:WARM,CM=COOL;WM.forEach(e=>out.push({k:'WARM UP',name:e[0],hint:e[1],secs:ws}));
 const main=Math.max(0,mins*60-(WM.length+CM.length)*ws),slots=Math.max(1,Math.floor(main/(w+r)));
 for(let i=0;i<slots;i++){const e=MAIN[i%MAIN.length];out.push({k:'WORK',name:e[0],hint:e[1],secs:w});if(i<slots-1)out.push({k:'REST',name:'REST',hint:'Shake it out and breathe',secs:r,next:MAIN[(i+1)%MAIN.length][0]})}
 CM.forEach(e=>out.push({k:'COOL DOWN',name:e[0],hint:e[1],secs:ws}));return out}
const MV={plan:[],i:0,t:0,state:'idle',elapsed:0,total:0,last:0,mid:false,lastSec:-1,shown:-1,cd:0,cdn:0};
function mvCue(it){MV.lastSec=-1;MV.mid=false;if(S.cues)beep(it.k==='REST'?440:880,.15,.2);if(it.k==='WORK')say(it.name.toLowerCase()+'. go.',{force:S.voice});else if(it.k==='REST')say('rest. next, '+it.next.toLowerCase()+'.',{force:S.voice});else say(it.name.toLowerCase(),{force:S.voice})}
function mvStop(){MV.cd=0;MV.pre=null;MV.preName=null;MV.needCue=false;MV.state='idle';MV.i=0;MV.t=0;MV.elapsed=0;try{speechSynthesis.cancel()}catch(e){}}
function mvStep(){if(MV.state!=='run')return;const n=performance.now(),dt=Math.min(2,(n-MV.last)/1000);MV.last=n;
 if(MV.cd>0){MV.cd-=dt;const c3=Math.ceil(MV.cd);if(c3<MV.cdn&&c3>=1){MV.cdn=c3;if(S.cues)beep(660,.1,.2)}if(MV.cd<=0){MV.cd=0;mvCue(MV.plan[MV.i])}return}
 MV.t+=dt;MV.elapsed+=dt;let it=MV.plan[MV.i];
 while(MV.t>=it.secs){MV.t-=it.secs;MV.i++;if(MV.i>=MV.plan.length){MV.state='done';MV.i=MV.plan.length-1;MV.t=0;beep(880,.5,.2);say('workout complete. great job.',{force:S.voice});wake(false);return}it=MV.plan[MV.i];mvCue(it)}
 const rem=Math.ceil(it.secs-MV.t);if(rem<=3&&rem!==MV.lastSec&&it.secs>=10){MV.lastSec=rem;if(S.cues)beep(660,.08,.15)}
 if(it.k==='WORK'&&it.secs>=40&&!MV.mid&&MV.t>=it.secs/2){MV.mid=true;say('halfway',{force:S.voice})}}

 {const idl=MV.state==='idle',dn=MV.state==='done',g=(id,v)=>{const e=document.getElementById(id);if(e&&e.disabled!==v)e.disabled=v};g('mvStopB',idl);g('mvPrev',idl);g('mvRedo',idl||dn||MV.cd>0);g('mvSkipB',idl||dn)}

 st('mvKind',MV.state==='done'?'DONE':it.k);st('mvName',MV.state==='done'?'WORKOUT COMPLETE':it.name);st('mvCount',MV.state==='done'?'OK':String(Math.max(1,Math.ceil(it.secs-MV.t))));st('mvHint','> '+(MV.state==='done'?'Great work. Hydrate and stretch.':it.hint));st('mvNext',nx?'NEXT // '+(it.k==='REST'?it.next:nx.name):'LAST MOVE');st('mvEl',mmss(MV.elapsed)+' / '+mmss(MV.total));setSegs('mvSeg',MV.elapsed/MV.total);st('mvBtn',MV.state==='run'?'PAUSE':MV.state==='pause'?'RESUME':'START AGAIN');
 if(MV.shown!==MV.i){MV.shown=MV.i;const list=document.getElementById('mvList');if(list){[...list.children].forEach((e,i)=>e.classList.toggle('on',i===MV.i));const e=list.children[MV.i];if(e){let q=list.parentElement;while(q&&q.id!=='main'&&q.scrollHeight<=q.clientHeight+2)q=q.parentElement;if(q&&q.id!=='main'){const tp=e.getBoundingClientRect().top-q.getBoundingClientRect().top+q.scrollTop-q.clientHeight/2+e.clientHeight/2;q.scrollTo({top:Math.max(0,tp),behavior:'smooth'})}}}}}

  const grp=(title,list)=>`<div class="lbl" style="margin-top:6px">${title}</div><div class="grid2">${list.map(e=>`<button class="btn sm" style="padding:0 4px;font-size:10px" data-act="mcAdd" data-arg="${e[0]}">+ ${e[0]}</button>`).join('')}</div>`;
  const rows=MC.items.map((it,i)=>`<div class="srow" style="flex-wrap:wrap"><span class="ot" style="min-width:150px">${it.ex}</span><span class="step"><span class="lbl">SEC</span><button class="btn sm" data-act="mcStep" data-arg="${i}:secs:-5" aria-label="Less seconds">-</button><span class="v" style="min-width:44px;font-size:16px">${it.secs}</span><button class="btn sm" data-act="mcStep" data-arg="${i}:secs:5" aria-label="More seconds">+</button></span><span class="step"><span class="lbl">SETS</span><button class="btn sm" data-act="mcStep" data-arg="${i}:sets:-1" aria-label="Fewer sets">-</button><span class="v" style="min-width:32px;font-size:16px">${it.sets}</span><button class="btn sm" data-act="mcStep" data-arg="${i}:sets:1" aria-label="More sets">+</button></span><span class="step"><button class="btn sm" data-act="mcUp" data-arg="${i}">UP</button><button class="btn sm" data-act="mcDel" data-arg="${i}" aria-label="Remove">X</button></span></div>`).join('')||'<div class="rt"><span>&gt; TAP EXERCISES ON THE LEFT TO ADD THEM</span></div>';
  return `<div class="grid">
   ${pn('Exercises','Pick',grp('Warm up',WARM)+grp('Main',MAIN)+grp('Cool down',COOL),'s2')}
   ${pn('Your Workout',MC.items.length+' Blocks','<div style="width:100%">'+rows+'</div>','s2','flush')}
   <div class="col">
    ${pn('Settings','Edit',`<div class="lbl">Rest between sets</div><div class="step"><button class="btn sm" data-act="mcRest" data-arg="-1" aria-label="Less rest">-</button><span class="v">${MC.rest}S</span><button class="btn sm" data-act="mcRest" data-arg="1" aria-label="More rest">+</button></div><label class="lbl" for="mcName">Workout name</label><input id="mcName" value="${esc(MC.name)}" maxlength="24" placeholder="MY WORKOUT" autocomplete="off"><div class="split"><span class="lbl">Total</span><span class="glow">${mmss(customSecs(mcNow()))}</span></div><div class="glow" id="mcMsg" style="min-height:18px">&gt;<span class="cur">_</span></div><button class="btn lg on" data-act="mcRun">SAVE AND START</button><button class="btn lg" data-act="mcSave">SAVE</button>`,'','','flex:1')}
   </div>
  </div>`},
 bind(){}
};
function sessionActive(){
 if(CUR==='move')return MV.state==='run'||MV.state==='pause';
 if(CUR==='breath')return !!(BR.run&&!BR.run.done);
 if(CUR==='med')return MD.state==='playing'||MD.state==='paused';
 return false;
}
function openDlg(){
 const d=$('#dlg');
 d.innerHTML='<div class="dlgbox"><div class="ot">Session in progress</div><div class="lbl">Pause it and stay here, or quit and go home?</div><div class="wrap"><button class="btn lg" style="flex:1" data-act="dlgPause">PAUSE</button><button class="btn lg on" style="flex:1" data-act="dlgQuit">QUIT</button></div><button class="btn" data-act="dlgBack">KEEP GOING</button></div>';
 d.hidden=false;
}
ACTS.dlgBack=()=>{$('#dlg').hidden=true};
ACTS.dlgPause=()=>{
 if(CUR==='move'&&MV.state==='run'){MV.state='pause';try{speechSynthesis.cancel()}catch(e){}}
 else if(CUR==='breath'&&BR.run&&BR.run.running){BR.run.running=false;try{speechSynthesis.cancel()}catch(e){}}
 else if(CUR==='med'&&MD.state==='playing')ACTS.mdPlay();
 $('#dlg').hidden=true;
};
ACTS.dlgQuit=()=>{$('#dlg').hidden=true;stopSessions();go('home')};

/* ================= day routines ================= */
const DR={active:false,steps:[],i:0,name:'',seen:false,t0:0,wait:false,launch:false,tok:0};
const DC={name:'',steps:[]};
const DTYPE={breath:'BREATH',move:'MOVE',med:'MEDITATE'};
function dsInfo(s){
 if(s.type==='breath'){const k=s.ref.split(':');if(k[0]==='r'){const r=S.routines.find(x=>x.id===k[1]);return r?[r.name,blocksSecs(r.blocks)]:null}const d=protoDef(k[1]);return d?[d.name,blocksSecs([blockFor(k[1])])]:null}
 if(s.type==='move'){const k=s.ref.split(':');if(k[0]==='c'){const r=(S.mvRoutines||[]).find(x=>x.id===k[1]);return r?[r.name,customSecs(r)]:null}return[k[1]+' MIN WORKOUT',(+k[1])*60]}
 const sc=SCRIPTS[+s.ref];return sc?[sc.name,mdSecs(sc)]:null}
function dayUI(txt){const bar=$('#daybar');if(!bar)return;bar.hidden=!DR.active;if(!DR.active)return;
 const s=DR.steps[DR.i],n=s?dsInfo(s):null;
 st('dayLbl',(DR.name?DR.name+' // ':'')+'STEP '+(Math.min(DR.i+1,DR.steps.length))+'/'+DR.steps.length+' // '+(s?DTYPE[s.type]:'')+' '+(n?n[0]:'')+(txt?' // '+txt:''));
 const nx=$('#dayNx');if(nx)nx.textContent=DR.i>=DR.steps.length-1?'FINISH >':'NEXT STEP >';const pv=$('#dayPv');if(pv)pv.disabled=DR.i<=0}
function dayQuit(){clearInterval(DR.bt);DR.go=null;$('#dlg').hidden=true;$('#dlg').style.background='';dayEnd(false);stopSessions();wake(false);go('home')}
function dayPause(){const s=DR.steps[DR.i],none=()=>{};if(!s)return none;
 if(s.type==='breath'){const R=BR.run;if(R&&!R.done&&R.running){R.running=false;try{speechSynthesis.cancel()}catch(e){}return()=>{if(BR.run===R&&!R.done){R.running=true;R.last=performance.now()}}}}
 else if(s.type==='move'){if(MV.state==='run'){MV.state='pause';mvHush();return()=>{if(MV.state==='pause'){MV.state='run';MV.last=performance.now()}}}}
 else if(MD.state==='playing'){ACTS.mdPlay();return()=>{if(MD.state==='paused')ACTS.mdPlay()}}
 return none}
function dayLaunch0(){
 while(DR.i<DR.steps.length&&!dsInfo(DR.steps[DR.i]))DR.i++;
 if(DR.i>=DR.steps.length){dayEnd(true);return}
 const s=DR.steps[DR.i],k=s.ref.split(':');DR.seen=false;DR.t0=Date.now();DR.wait=false;DR.tok++;DR.launch=true;
 try{
  if(s.type==='breath'){stopBR();BR.sel=k[0]==='r'?{type:'routine',id:k[1]}:{type:'proto',id:k[1]};go('breath');ACTS.start()}
  else if(s.type==='move'){if(k[0]==='c')S.move.custom=k[1];else{S.move.custom=null;S.move.mins=+k[1]}go('move');ACTS.mvStart()}
  else{MD.sel=+s.ref;go('med');ACTS.mdPlay()}
 }catch(e){}
 DR.launch=false;dayUI()}
function dayEnd(done){const was=DR.active;DR.active=false;DR.wait=false;DR.tok++;dayUI();
 if(done&&was){if(S.cues)beep(880,.4,.2);say('combo complete. nice work.',{force:S.voice});DR.launch=true;go('home');DR.launch=false;dayDone()}}
function dayDone(){
 const rows=DR.steps.map((x,i)=>{const n=dsInfo(x);return n?'<div class="split" style="gap:12px;text-align:left"><span class="lbl" style="font-size:16px;letter-spacing:.14em">'+(i+1)+'. '+DTYPE[x.type]+' // '+esc(n[0])+'</span><span class="glow" style="font-size:18px">'+mmss(n[1])+'</span></div>':''}).join('');
 const tot=DR.steps.reduce((q,x)=>{const n=dsInfo(x);return q+(n?n[1]:0)},0),cnt=DR.steps.filter(x=>dsInfo(x)).length;
 const d=$('#dlg');d.style.background='#000';d.innerHTML='<div class="dlgbox" style="min-width:min(640px,92vw);border:0;box-shadow:none;background:transparent;gap:18px"><div class="ot" style="font-size:26px;text-align:center">'+esc(DR.name)+' COMPLETE</div><div class="glow" style="text-align:center;font-size:18px;line-height:1.6">You showed up and finished every step. Your mind, your body and your soul all got their time today. Be proud of that.</div><div style="display:flex;flex-direction:column;gap:8px;width:100%">'+rows+'</div><div class="split" style="border-top:1px solid var(--b40);padding-top:8px"><span class="lbl" style="font-size:16px">'+cnt+' STEPS // TOTAL</span><span class="glow" style="font-size:20px">'+mmss(tot)+'</span></div><button class="btn lg on" data-act="dayDone">DONE</button></div>';d.hidden=false}
ACTS.dayDone=()=>{const d=$('#dlg');d.hidden=true;d.style.background=''};
function dayAdvance(){DR.tok++;DR.i++;if(DR.i>=DR.steps.length)dayEnd(true);else dayIntro()}
function dayIntro(){
 while(DR.i<DR.steps.length&&!dsInfo(DR.steps[DR.i]))DR.i++;
 if(DR.i>=DR.steps.length){dayEnd(true);return}
 clearInterval(DR.bt);DR.tok++;DR.wait=true;stopSessions();wake(false);
 const x=DR.steps[DR.i],n=dsInfo(x);let c=10;
 const d=$('#dlg');d.style.background='#000';d.innerHTML='<div class="dlgbox" style="min-width:min(640px,92vw);border:0;box-shadow:none;background:transparent;gap:18px;text-align:center"><div class="lbl" style="font-size:16px">STEP '+(DR.i+1)+' OF '+DR.steps.length+' // UP NEXT</div><div class="ot" style="font-size:22px">'+DTYPE[x.type]+'</div><div class="glow" style="font-family:\'Orbitron\',sans-serif;font-size:28px;letter-spacing:.2em">'+esc(n[0])+'</div><div class="glow" style="font-size:20px">'+mmss(n[1])+'</div><div class="lbl">STARTING IN</div><div class="big glow" id="dayCd" style="font-size:96px">10</div><div class="wrap"><button class="btn lg on" style="flex:1" data-act="dayGo">START NOW</button><button class="btn lg" style="flex:1" data-act="dayQuitNow">END ROUTINE</button></div></div>';d.hidden=false;
 const go=()=>{clearInterval(DR.bt);DR.go=null;d.hidden=true;d.style.background='';if(DR.active)dayLaunch0()};DR.go=go;dayUI();
 DR.bt=setInterval(()=>{c--;st('dayCd',String(c));if(S.cues&&c>0)beep(660,.1,.15);if(c<=0)go()},1000)}
function dayTick(){
 if(!DR.active||DR.wait)return;const s=DR.steps[DR.i];if(!s)return;let act,done;
 if(s.type==='breath'){const R=BR.run;act=!!(R&&!R.done)&&CUR==='breath';done=!!(R&&R.done)&&CUR==='breath'}
 else if(s.type==='move'){act=CUR==='move'&&(MV.state==='run'||MV.state==='pause');done=CUR==='move'&&MV.state==='done'}
 else{act=CUR==='med'&&(MD.state==='playing'||MD.state==='paused');done=CUR==='med'&&MD.state==='done'}
 if(act)DR.seen=true;
 if(done){DR.wait=true;const tk=++DR.tok;dayUI('DONE, NEXT UP...');setTimeout(()=>{if(DR.active&&DR.tok===tk)dayAdvance()},3500)}
 else if(!act&&(DR.seen||Date.now()-DR.t0>8000))dayEnd(false)}
function dayStartNow(r){clearInterval(DR.bt);$('#dlg').hidden=true;DR.steps=r.steps.slice();DR.i=0;DR.name=r.name;DR.active=true;DR.go=null;dayIntro()}
ACTS.runDay=id=>{const r=(S.dayRoutines||[]).find(x=>x.id===id);if(!r||!r.steps.length)return;ac();DR.pend=r;
 const rows=r.steps.map((x,i)=>{const n=dsInfo(x);return n?'<div class="split" style="gap:12px;text-align:left"><span class="lbl" style="font-size:16px;letter-spacing:.14em">'+(i+1)+'. '+DTYPE[x.type]+' // '+esc(n[0])+'</span><span class="glow" style="font-size:18px">'+mmss(n[1])+'</span></div>':''}).join('');
 const tot=r.steps.reduce((q,x)=>{const n=dsInfo(x);return q+(n?n[1]:0)},0);let c=10;DR.bt&&clearInterval(DR.bt);
 const d=$('#dlg');d.style.background='#000';d.innerHTML='<div class="dlgbox" style="min-width:min(640px,92vw);border:0;box-shadow:none;background:transparent;gap:18px"><div class="ot" style="font-size:22px">'+esc(r.name)+' // '+r.steps.length+' STEPS</div><div style="display:flex;flex-direction:column;gap:8px;width:100%">'+rows+'</div><div class="split" style="border-top:1px solid var(--b40);padding-top:8px"><span class="lbl" style="font-size:16px">TOTAL</span><span class="glow" style="font-size:20px">'+mmss(tot)+'</span></div><div class="lbl" style="text-align:center">STARTING IN</div><div class="big glow" id="dayCd" style="text-align:center;font-size:96px">10</div><div class="wrap"><button class="btn lg on" style="flex:1" data-act="dayGo">START NOW</button><button class="btn lg" style="flex:1" data-act="dayCancel">CANCEL</button></div></div>';d.hidden=false;
 DR.bt=setInterval(()=>{c--;st('dayCd',String(c));if(S.cues&&c>0)beep(660,.1,.15);if(c<=0)dayStartNow(r)},1000)};
ACTS.dayGo=()=>{if(DR.go)DR.go();else if(DR.pend)dayStartNow(DR.pend)};
ACTS.dayCancel=()=>{clearInterval(DR.bt);$('#dlg').hidden=true};
ACTS.dayNext=()=>{if(DR.active)dayAdvance()};
ACTS.dayEnd=()=>{if(!DR.active)return;const back=dayPause();askDlg('End routine?','This stops the current step and the whole routine.',[{l:'YES, END IT',on:1,fn:dayQuit},{l:'NO, KEEP GOING',fn:back}])};
ACTS.dayPrev=()=>{if(!DR.active)return;DR.tok++;DR.i=Math.max(0,DR.i-1);dayIntro()};
ACTS.dayRedo=()=>{if(!DR.active)return;DR.tok++;dayLaunch0()};
ACTS.dayQuitNow=()=>dayQuit();
ACTS.togRoutines=()=>{S.showRoutines=!S.showRoutines;save();const rb=$('#rtBtn');if(rb)rb.classList.toggle('on',!!S.showRoutines);render()};
ACTS.dcAdd=a=>{const i=a.indexOf('|');DC.steps.push({type:a.slice(0,i),ref:a.slice(i+1)});render()};
ACTS.dcDel=i=>{DC.steps.splice(+i,1);render()};
ACTS.dcUp=i=>{i=+i;if(i>0){const t=DC.steps[i];DC.steps[i]=DC.steps[i-1];DC.steps[i-1]=t}render()};
function dcSaveNow(){
 if(!DC.steps.length){st('dcMsg','> ADD AT LEAST ONE STEP');return null}
 const name=(DC.name||'DAY '+((S.dayRoutines||[]).length+1)).toUpperCase(),r={id:'d'+Date.now(),name,steps:DC.steps.map(x=>Object.assign({},x))};
 S.dayRoutines=(S.dayRoutines||[]).concat([r]);save();st('dcMsg','> SAVED: '+name);return r}
ACTS.dcSave=()=>{dcSaveNow()};
ACTS.dcRun=()=>{const r=dcSaveNow();if(r)ACTS.runDay(r.id)};
ACTS.delDay=id=>{S.dayRoutines=(S.dayRoutines||[]).filter(r=>r.id!==id);save();render()};
SCREENS.daycustom={
 html(){
  const add=(t,ref,label,secs)=>`<button class="btn sm" style="justify-content:space-between;padding:0 8px;font-size:10px" data-act="dcAdd" data-arg="${t}|${ref}"><span>+ ${esc(label)}</span><span>${mmss(secs)}</span></button>`;
  const bl=S.routines.map(r=>add('breath','r:'+r.id,r.name,blocksSecs(r.blocks))).concat(Object.keys(BUILTIN).concat(S.customs.map(c=>c.id)).map(id=>{const d=protoDef(id);return d?add('breath','p:'+id,d.name,blocksSecs([blockFor(id)])):''})).join('');
  const ml=(S.mvRoutines||[]).map(r=>add('move','c:'+r.id,r.name,customSecs(r))).concat([5,10,15,30,45,60].map(m=>add('move','m:'+m,m+' MIN WORKOUT',m*60))).join('');
  const dl=SCRIPTS.map((sc,i)=>add('med',String(i),sc.name,mdSecs(sc))).join('');
  const grp=(t,h)=>`<div class="lbl" style="margin-top:6px">${t}</div><div style="display:flex;flex-direction:column;gap:6px">${h}</div>`;
  let tot=0;
  const rows=DC.steps.map((x,i)=>{const n=dsInfo(x)||['MISSING',0];tot+=n[1];return `<div class="srow" style="flex-wrap:wrap"><span class="ot" style="min-width:150px">${i+1}. ${DTYPE[x.type]} // ${esc(n[0])}</span><span class="lbl">${mmss(n[1])}</span><span class="step"><button class="btn sm" data-act="dcUp" data-arg="${i}">UP</button><button class="btn sm" data-act="dcDel" data-arg="${i}" aria-label="Remove">X</button></span></div>`}).join('')||'<div class="rt"><span>&gt; TAP ITEMS ON THE LEFT TO BUILD YOUR DAY</span></div>';
  const saved=(S.dayRoutines||[]).map(r=>`<div class="prow"><span class="lbl" style="flex:1">${esc(r.name)}</span><button class="btn sm" data-act="delDay" data-arg="${r.id}" aria-label="Delete">X</button></div>`).join('');
  return `<div class="grid">
   ${pn('Add Steps','Pick',grp('Breathe',bl)+grp('Move',ml)+grp('Meditate',dl),'s2')}
   ${pn('Your Day',DC.steps.length+' Steps','<div style="width:100%">'+rows+'</div>','s2','flush')}
   <div class="col">
    ${pn('Settings','Edit',`<label class="lbl" for="dcName">Routine name</label><input id="dcName" value="${esc(DC.name)}" maxlength="24" placeholder="MY COMBO" autocomplete="off"><div class="split"><span class="lbl">Total</span><span class="glow">${mmss(tot)}</span></div><div class="lbl">Each step starts by itself when the last one ends.</div><div class="glow" id="dcMsg" style="min-height:18px">&gt;<span class="cur">_</span></div><button class="btn lg on" data-act="dcRun">SAVE AND START</button><button class="btn lg" data-act="dcSave">SAVE</button>`,'','','flex:1')}
    ${saved?pn('Saved','Combos',saved,'','',''):''}
   </div>
  </div>`},
 bind(){}
};

/* ================= settings ================= */
let SETTAB='DISPLAY',RESET=false;
function openSet(){const o=$('#ovl');o.hidden=false;const tabs=['DISPLAY','AUDIO','DATA'].map(t=>`<button class="btn ${SETTAB===t?'on':''}" data-act="setTab" data-arg="${t}">${t}</button>`).join('');let body='';
 if(SETTAB==='DISPLAY')body=`<div class="ot">Accent color</div><div class="wrap">${accList().map(a=>`<button class="sw ${S.accent===a[1]?'on':''}" style="background:${a[1]}" data-act="accent" data-arg="${a[1]}" aria-label="${a[0]}"></button>`).join('')}</div><div class="lbl">${accList().find(a=>a[1]===S.accent)?accList().find(a=>a[1]===S.accent)[0]:''}</div>`;
 if(SETTAB==='DISPLAY')body+=`<div class="ot" style="margin-top:18px">General theme</div><div class="wrap"><button class="btn ${S.look!=='normal'?'on':''}" data-act="look" data-arg="matrix">MATRIX</button><button class="btn ${S.look==='normal'?'on':''}" data-act="look" data-arg="normal">NORMAL</button></div><div class="lbl">${S.look==='normal'?'Clean look with solid 3D visuals':'Retro console with wireframe visuals'}</div>`;
 else if(SETTAB==='AUDIO'){const vs=voiceList();
  body=`<div class="ot">Voice guide</div><div class="wrap"><button class="btn ${S.voice?'on':''}" data-act="togVoice2">ON</button><button class="btn ${S.voice?'':'on'}" data-act="togVoice2">OFF</button></div><div class="ot">Cue tones</div><div class="wrap"><button class="btn ${S.cues?'on':''}" data-act="togCues2">ON</button><button class="btn ${S.cues?'':'on'}" data-act="togCues2">OFF</button></div><div class="ot">Speech speed</div><div class="wrap">${[['SLOW',.75],['NORMAL',.9],['FAST',1.05]].map(r=>`<button class="btn ${S.rate===r[1]?'on':''}" data-act="rate" data-arg="${r[1]}">${r[0]}</button>`).join('')}</div><div class="ot">Affirmation reverb</div><div class="wrap"><button class="btn ${S.voiceFx?'on':''}" data-act="voiceFx" data-arg="1">ON</button><button class="btn ${S.voiceFx?'':'on'}" data-act="voiceFx" data-arg="0">OFF</button></div><div class="lbl">Mac and iPhone app only. Experimental: if it ever crashes the app, it switches itself off.</div><div class="ot">Voice</div><div class="wrap">${vs.length?vs.map(v=>`<button class="btn sm ${VOICE&&VOICE.name===v.name?'on':''}" data-act="voiceName" data-arg="${esc(v.name)}">${esc(vLabel(v.name))}</button>`).join(''):'<span class="lbl">System voices not available here.</span>'}</div><div class="wrap"><button class="btn sm ${S.allVoices?'on':''}" data-act="allVoices">${S.allVoices?'SHOWING ALL VOICES':'SHOW ALL VOICES'}</button></div><div class="lbl">${nVoices()} voices visible to this app. More voices: download them in your system settings (on Mac: Accessibility, Spoken Content, System Voice, Manage Voices), then fully quit and reopen the app.</div><button class="btn" style="align-self:flex-start" data-act="testVoice">TEST VOICE</button>`}
 else body=`<div class="ot">Saved data</div><div class="lbl">${S.customs.length} custom protocols, ${S.routines.length} routines. Stored on this device only.</div><button class="btn ${RESET?'on':''}" style="align-self:flex-start" data-act="reset">${RESET?'CONFIRM RESET':'RESET ALL DATA'}</button>`;
 o.innerHTML=`<div class="tb" style="display:flex;justify-content:space-between"><div class="ttl" style="text-align:left">O3D-ALIGN // SETTINGS</div><button class="btn sm" data-act="closeSet">CLOSE</button></div><div class="ovb"><div class="tabs">${tabs}</div><div class="set">${body}</div></div>`}
ACTS.openSet=()=>openSet();
ACTS.closeSet=()=>{$('#ovl').hidden=true;RESET=false;render()};
ACTS.setTab=t=>{SETTAB=t;RESET=false;openSet()};
ACTS.look=v=>{S.look=v==='normal'?'normal':'matrix';if(S.look==='normal'&&ACC.some(a=>a[1]===S.accent))S.accent='#0a84ff';if(S.look!=='normal'&&ACCN.some(a=>a[1]===S.accent))S.accent='#00ff41';theme();save();openSet()};
ACTS.accent=c=>{S.accent=c;theme();save();openSet()};
ACTS.togVoice2=()=>{S.voice=!S.voice;save();openSet()};
ACTS.togCues2=()=>{S.cues=!S.cues;save();openSet()};
ACTS.rate=v=>{S.rate=+v;save();openSet()};
ACTS.voiceFx=v=>{S.voiceFx=v==='1';save();openSet()};
ACTS.allVoices=()=>{S.allVoices=!S.allVoices;save();openSet()};
ACTS.voiceName=n=>{S.voiceName=n;pickVoice();save();openSet()};
ACTS.testVoice=()=>say('Breathe in. Breathe out. You are doing great.',{force:true});
ACTS.reset=()=>{if(!RESET){RESET=true;openSet();return}try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
function mixHtml(){return '<div class="dlgbox" style="min-width:min(560px,92vw);gap:18px"><div class="ot" style="font-size:20px">AUDIO MIXER</div>'+MODS.map(m=>{const c=Math.round(mvol(m[0])*20);return '<div style="width:100%;display:flex;flex-direction:column;gap:6px"><div class="split"><span class="lbl" style="font-size:14px;letter-spacing:.14em">'+m[1]+'</span><span class="glow">'+Math.round(mvol(m[0])*100)+'%</span></div><div style="display:flex;gap:2px">'+Array.from({length:20},(_,j)=>'<button class="seg v '+(j<c?'on':'')+'" data-act="mixVol" data-arg="'+m[0]+':'+(j+1)+'" aria-label="'+m[1]+' volume '+(j+1)+'"></button>').join('')+'</div></div>'}).join('')+'<div class="wrap" style="width:100%"><button class="btn lg '+(MUTE?'on':'')+'" style="flex:1" id="mxMute" data-act="mute">'+(MUTE?'UNMUTE ALL':'MUTE ALL')+'</button><button class="btn lg" style="flex:1" data-act="dayDone">DONE</button></div></div>'}
ACTS.openMix=()=>{ac();const d=$('#dlg');d.style.background='';d.innerHTML=mixHtml();d.hidden=false};
ACTS.mixVol=a=>{const[k,v]=a.split(':');const x=Number(v)/20;S.vol=S.vol||{};S.vol[k]=(S.vol[k]!=null&&Math.abs(S.vol[k]-x)<.001)?0:x;save();try{if(BUS[k])BUS[k].gain.setTargetAtTime(S.vol[k],AC.currentTime,.03)}catch(e){}const d=$('#dlg');d.innerHTML=mixHtml();beep(660,.12,.15,k)};
ACTS.fs=()=>{try{if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.speech)window.webkit.messageHandlers.speech.postMessage({cmd:'fullscreen'});else if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}};
function showIntro(){const d=$('#dlg');d.style.background='#000';d.innerHTML='<div class="dlgbox" style="min-width:min(760px,92vw);border:0;box-shadow:none;background:transparent;gap:24px;text-align:center"><div class="ot" style="font-size:30px">WELCOME TO O3D-ALIGN</div><div class="glow" style="font-size:20px;line-height:1.7">Four modules: BREATHE, MOVE, MEDITATE and RELAX.<br>Everything runs on your device and nothing is uploaded.</div><div class="lbl" style="font-size:15px;line-height:1.7">Not medical advice. Stop anything that feels wrong, and check with a doctor before intense breathwork or exercise.</div><button class="btn lg on" data-act="dayDone">ENTER</button></div>';d.hidden=false}
function postDrag(){try{if(!document.documentElement.classList.contains('native-mac'))return;const open=!$('#ovl').hidden||!$('#dlg').hidden,hb=$('#homeBtn'),r=document.querySelector('.r');let x=84;if(hb&&!hb.hidden)x=Math.max(x,hb.getBoundingClientRect().right+10);const e=r?r.getBoundingClientRect().left-10:innerWidth,key=open?'0':Math.round(x)+':'+Math.round(e-x);if(key===postDrag.k)return;postDrag.k=key;window.webkit.messageHandlers.speech.postMessage({cmd:'drag',x:x,w:Math.max(0,e-x),on:!open&&e>x})}catch(er){}}
ACTS.mute=()=>{MUTE=!MUTE;try{if(MASTER)MASTER.gain.setTargetAtTime(MUTE?0:1,AC.currentTime,.05)}catch(e){}
 try{SL.layers.forEach(L=>{if(L.file&&L.file.el)L.file.el.muted=MUTE})}catch(e){}
 const b=document.getElementById('muteBtn');if(b){b.textContent=MUTE?'MUTED':'AUDIO';b.classList.toggle('on',MUTE)}const mb=document.getElementById('mxMute');if(mb){mb.textContent=MUTE?'UNMUTE ALL':'MUTE ALL';mb.classList.toggle('on',MUTE)}};
ACTS.home=()=>{if(sessionActive())openDlg();else go('home')};

/* ================= navigation + boot ================= */
function stopSessions(){stopBR();mvStop();mdStop()}
function mount(){FR=[];for(const k in cache)delete cache[k];const s=SCREENS[CUR],m=$('#main');m.innerHTML=s.html();$('#ttl').textContent='O3D-ALIGN // '+TITLES[CUR];$('#homeBtn').hidden=CUR==='home';{const rb=$('#rtBtn');if(rb){rb.hidden=CUR!=='home';rb.classList.toggle('on',!!S.showRoutines)}}if(s.bind)s.bind();m.classList.toggle('focus',!!DR.active&&CUR!=='home'&&CUR!=='daycustom');dayUI()}
function go(name){if(!DR.launch)DR.active=false;stopSessions();CUR=name;mount();$('#main').scrollTop=0}
function render(){const m=$('#main'),tops=[...m.querySelectorAll('.pb')].map(e=>e.scrollTop),top=m.scrollTop;mount();m.scrollTop=top;[...m.querySelectorAll('.pb')].forEach((e,i)=>{if(tops[i])e.scrollTop=tops[i]})}
function onClick(e){const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a.indexOf('go:')===0){go(a.slice(3));return}if(ACTS[a])ACTS[a](b.dataset.arg,b,e)}
$('#main').addEventListener('click',onClick);$('#ovl').addEventListener('click',onClick);$('#dlg').addEventListener('click',onClick);$('.tb').addEventListener('click',onClick);$('#daybar').addEventListener('click',onClick);
$('#main').addEventListener('input',e=>{if(e.target.id==='cbName')CB.name=e.target.value;if(e.target.id==='cbRname')CB.rname=e.target.value;if(e.target.id==='mcName')MC.name=e.target.value;if(e.target.id==='dcName')DC.name=e.target.value});
$('#main').addEventListener('change',e=>{const t=e.target;if(t.id==='cbSel'){CB.pickP=t.value;const o=cbOpt(t.value);if(o)CB.amt=o.def;cbAmtUI()}if(t.matches&&t.matches('input[type=file][data-layer]')){loadFile(+t.dataset.layer,t.files[0])}});
function clock(){const d=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes()),ds=d.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'}).toUpperCase().replace(',','');const k=ds+t;if(cache.sync!==k){cache.sync=k;const e=$('#sync');if(e)e.innerHTML='● <span class="dm">'+ds+' // </span>'+t}}
setInterval(clock,1000);setInterval(()=>{mvStep();mvUI();mdTick();dayTick();postDrag();SL.layers.forEach((L,i)=>st('fs'+i,L.file?L.file.state:''))},100);
clock();mount();
{const fb=$('#fsBtn');if(fb)fb.hidden=!(document.documentElement.classList.contains('native-mac')||(document.fullscreenEnabled&&!navigator.maxTouchPoints))}
if(!S.seen){S.seen=1;save();setTimeout(showIntro,400)}
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body></html>
